name: Deploy Supabase Functions

# Auto-deploys all Supabase Edge Functions on push to main, so functions ship
# the same way the frontend does — no local terminal needed.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    – your project ref (Project Settings → General)
# The functions' own secret (ANTHROPIC_API_KEY) is set once in the Supabase
# dashboard under Edge Functions → Secrets, not here.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
